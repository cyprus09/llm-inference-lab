[project]
name = "llm-inference-lab"
version = "0.1.0"
description = "System-level exploration of LLM inference: entropy tracking, attention sinks, speculative decoding"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
    "transformers>=4.42.0",
    "accelerate>=0.31.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
]

[tool.uv]
# nothing special needed, placeholder for future uv-specific config